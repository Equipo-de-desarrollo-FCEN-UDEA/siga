<div [formGroup]="form">

  <!-- DOCUMENTS EDIT -->
  <div class="row regular-row mt-4" *ngIf="documents && documents.length > 0">
    <div class="col-md-4 col-xs-12 col-sm-6 label mb-2">Documentos</div>
    <div class="col-sm-8">
      <ul
        *ngFor="let doc of documents; let i = index"
        class="list-group"
      >
        <li [id]="i" class="list-group-item d-flex justify-content-between">
          <span>{{ doc.name }}</span>
          <span
            style="width: fit-content; margin: 0"
          >
          <button
          class="btn btn-circle"
          type="button"
          (click)="deleteDocument(doc.path, i)"
        >
          <i class="fa fa-times-circle"></i>
          </button>
          </span>
        </li>
      </ul>
    </div>
  </div>

  <h6 class="mt-3">
    <strong>Archivos adjuntos de la solicitud</strong>
  </h6>
  <hr style="margin-top: 0" />

  <div
    class="alert alert-danger"
    *ngIf="files.length > 0 && !validFileType()"
  >
    Ese tipo de archivo no es permitido.
  </div>

  <div class="alert alert-danger" *ngIf="files.length > 0 && !validSize()">
    Los archivos no deben pesar más de 6 MB.
  </div>

  <div class="alert alert-danger" *ngIf="documents.length > 3 && !validSize()">
    Los archivos no deben pesar más de 6 MB.
  </div>

  <div class="alert alert-danger" *ngIf="files.length>0 && !validFileCount()">
    No debe adjuntar más de 3 archivos.
  </div>


  <div class="formfloatig mb-3" style="flex-direction: column">
    <div
      *ngFor="let producto of document_new; last as isLast; let i = index"
      class="arrayLike formfloatig d-flex justify-content-between"
    >
      <div class="document_new"
           style="width: auto; margin-left: 10px">

        <label class="btn-btn-default cursor is-hoverable">
          <div class="fa fa-upload fa-2x"></div>

          <input
            [id]="i"
            class="file-upload"
            type="file"
            (change)="onUpload($event, i)"
            
            />
          <label
            [for]="i"
            class="is-hoverable cursor link-success"
            style="margin-left: 10px"
            >{{ files[i] && files[i].name ? files[i].name : "Subir archivos de la solicitud"}}
            </label>
        </label>
      </div>

      <!-- Botones que solo funcionan en comisiones (applycationType==2)-->
      <div 
      class="buttons"
      *ngIf="this.applycationType == 2"> 
        <button
        *ngIf="document_new.length > 1"
          class="btn btn-circle btn-remove m-1"
          type="button"
          (click)="removeFile(i); document_new.splice(i, 1)"
        >
        <i class="fa fa-minus"></i>
          </button>

        <button
        class="btn btn-circle btn-add m-1"
        type="button"
        (click)="document_new.push(1)"
        *ngIf="isLast && document_new.length < 3"
      >
        <i class="fa fa-plus"></i>
      </button>

      </div>
    </div>
  </div>
</div>
